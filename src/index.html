<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛车主题记分板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <!-- 引入Orbitron字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- 配置Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          // 自定义颜色 - 将racingBlue调整为更浅的蓝色
          colors: {
            primary: '#165DFF', // 主色调 - 蓝色
            secondary: '#36CFC9', // 次色调
            accent: '#FFD700', // 金色，用于强调
            danger: '#F53F3F', // 危险提示颜色
            dark: '#1D2129', // 深色背景
            light: '#F2F3F5', // 浅色背景
            racingBlue: '#66CCFF', // 更浅的蓝色
          },
          // 自定义字体
          fontFamily: {
            // 使用Orbitron作为主要字体
            racing: ['Orbitron', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      /* 内容自动可见性，用于优化性能 */
      .content-auto {
        content-visibility: auto;
      }
      /* 分数过渡动画，使分数变化更平滑 */
      .score-transition {
        transition: all 0.3s ease;
      }
      /* 按钮点击缩放效果，模拟弹跳 */
      .btn-bounce {
        @apply transition-transform active:scale-90;
      }
      /* 团队边框样式 - 移除边框和背景 */
      .team-border {
        border: none;
        background-color: transparent;
        padding: 0;
      }
      /* 背景图片 */
      .bg-racing {
        background-image: url('images/背景.jpg'); /* 添加背景图片 */
        background-size: cover;
        background-position: center;
      }
      /* 自定义模糊效果 */
      .backdrop-blur {
        backdrop-filter: blur(8px);
      }
      /* 新增浅蓝色半透明按钮样式（透明度50%） */
      .btn-blue {
        @apply bg-racingBlue/50 text-white hover:bg-racingBlue/70 transition-colors; /* 背景透明度50%，悬停时70% */
      }
      /* 减小玩家团队模式上下边距 */
      .team {
        margin-top: 0.25rem;
        margin-bottom: 0.25rem;
      }
    }
  </style>
</head>

<body class="font-racing min-h-screen text-white bg-racing">
  <!-- 半透明遮罩层 - 浅色50%透明并增加模糊效果 -->
  <div class="fixed inset-0 bg-light/50 backdrop-blur z-0"></div>
  
  <div class="container mx-auto px-3 py-6 max-w-4xl relative z-10">
    <!-- 顶部标题和模式切换 -->
    <header class="mb-4">
      <div class="flex items-center justify-between mb-3">
        <!-- 左右模式切换按钮（背景透明度50%） -->
        <button id="prev-mode" class="w-8 h-8 btn-blue flex items-center justify-center text-xs btn-bounce rounded">
          <i class="fa fa-arrow-left"></i>
        </button>
        
        <h1 id="mode-title" class="text-[clamp(1rem,2.5vw,1.5rem)] font-bold text-white transition-all duration-500">滴血模式</h1>
        
        <!-- 左右模式切换按钮（背景透明度50%） -->
        <button id="next-mode" class="w-8 h-8 btn-blue flex items-center justify-center text-xs btn-bounce rounded">
          <i class="fa fa-arrow-right"></i>
        </button>
      </div>
    </header>
    
    <!-- 记分板主体内容 -->
    <main id="scoreboard" class="transition-all duration-500">
      <!-- 滴血模式 (默认显示) -->
      <div id="blood-mode" class="mode-content">
        <div class="grid grid-cols-1 gap-3">
          <!-- 玩家1-6 -->
          <div class="team-border">
            <div class="grid grid-cols-1 gap-0.5">
              <!-- 玩家卡片将在这里动态生成 -->
            </div>
          </div>
        </div>
      </div>
      
      <!-- 抢分模式 -->
      <div id="score-mode" class="mode-content hidden">
        <div class="grid grid-cols-1 gap-3">
          <div class="team-border">
            <div class="grid grid-cols-1 gap-0.5">
              <!-- 玩家卡片将在这里动态生成 -->
            </div>
          </div>
        </div>
      </div>
      
      <!-- 2V模式 -->
      <div id="2v-mode" class="mode-content hidden">
        <div class="grid grid-cols-1 gap-3">
          <!-- 3个团队，每个团队2名玩家 -->
          <div class="team team-border">
            <div class="team-total mb-2 text-center text-xs font-bold text-white">团队1总分: <span>0</span></div>
            <div class="grid grid-cols-1 gap-0.5">
              <!-- 玩家1-2 -->
            </div>
          </div>
          
          <div class="team team-border">
            <div class="team-total mb-2 text-center text-xs font-bold text-white">团队2总分: <span>0</span></div>
            <div class="grid grid-cols-1 gap-0.5">
              <!-- 玩家3-4 -->
            </div>
          </div>
          
          <div class="team team-border">
            <div class="team-total mb-2 text-center text-xs font-bold text-white">团队3总分: <span>0</span></div>
            <div class="grid grid-cols-1 gap-0.5">
              <!-- 玩家5-6 -->
            </div>
          </div>
        </div>
      </div>
      
      <!-- 3V模式 -->
      <div id="3v-mode" class="mode-content hidden">
        <div class="grid grid-cols-1 gap-3">
          <!-- 2个团队，每个团队3名玩家 -->
          <div class="team team-border">
            <div class="team-total mb-2 text-center text-xs font-bold text-white">团队1总分: <span>0</span></div>
            <div class="grid grid-cols-1 gap-0.5">
              <!-- 玩家1-3 -->
            </div>
          </div>
          
          <div class="team team-border">
            <div class="team-total mb-2 text-center text-xs font-bold text-white">团队2总分: <span>0</span></div>
            <div class="grid grid-cols-1 gap-0.5">
              <!-- 玩家4-6 -->
            </div>
          </div>
        </div>
      </div>
    </main>
    
    <!-- 重置按钮 -->
    <div class="mt-5 text-center">
      <button id="reset-btn" class="px-4 py-1.5 btn-blue text-white rounded-lg font-medium btn-bounce hover:bg-racingBlue/70 flex items-center gap-1.5 mx-auto text-xs">
        <i class="fa fa-refresh"></i>
        <span>重置分数</span>
      </button>
    </div>
  </div>

  <script>
    // 玩家数据
    const players = [
      { id: 1, name: '玩家1', score: 6 },
      { id: 2, name: '玩家2', score: 6 },
      { id: 3, name: '玩家3', score: 6 },
      { id: 4, name: '玩家4', score: 6 },
      { id: 5, name: '玩家5', score: 6 },
      { id: 6, name: '玩家6', score: 6 }
    ];
    
    // 模式配置
    const modes = [
      { id: 'blood', name: '滴血模式', initialScore: 6 },
      { id: 'score', name: '抢分模式', initialScore: 0 },
      { id: '2v', name: '2V模式', initialScore: 0 },
      { id: '3v', name: '3V模式', initialScore: 0 }
    ];
    
    let currentModeIndex = 0;
    
    // DOM 加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
      initializeScoreboards();
      setupEventListeners();
      updateTeamTotals();
    });
    
    // 初始化所有记分板
    function initializeScoreboards() {
      // 初始化滴血模式和抢分模式
      ['blood-mode', 'score-mode'].forEach(modeId => {
        const container = document.getElementById(modeId);
        const isBloodMode = modeId === 'blood-mode';
        
        // 清空容器
        container.innerHTML = `
          <div class="grid grid-cols-1 gap-3">
            <div class="team-border">
              <div class="grid grid-cols-1 gap-0.5">
                <!-- 玩家卡片将在这里动态生成 -->
              </div>
            </div>
          </div>
        `;
        
        const playerContainer = container.querySelector('.team-border div');
        
        // 添加玩家卡片
        players.forEach(player => {
          const initialScore = isBloodMode ? 6 : 0;
          playerContainer.appendChild(createPlayerCard(player.id, player.name, initialScore));
        });
      });
      
      // 初始化2V模式
      const twoVContainer = document.getElementById('2v-mode');
      const twoVTeams = twoVContainer.querySelectorAll('.team');
      
      // 为2V模式添加玩家
      twoVTeams[0].querySelector('div').appendChild(createPlayerCard(1, '玩家1', 0));
      twoVTeams[0].querySelector('div').appendChild(createPlayerCard(2, '玩家2', 0));
      twoVTeams[1].querySelector('div').appendChild(createPlayerCard(3, '玩家3', 0));
      twoVTeams[1].querySelector('div').appendChild(createPlayerCard(4, '玩家4', 0));
      twoVTeams[2].querySelector('div').appendChild(createPlayerCard(5, '玩家5', 0));
      twoVTeams[2].querySelector('div').appendChild(createPlayerCard(6, '玩家6', 0));
      
      // 初始化3V模式
      const threeVContainer = document.getElementById('3v-mode');
      const threeVTeams = threeVContainer.querySelectorAll('.team');
      
      // 为3V模式添加玩家
      threeVTeams[0].querySelector('div').appendChild(createPlayerCard(1, '玩家1', 0));
      threeVTeams[0].querySelector('div').appendChild(createPlayerCard(2, '玩家2', 0));
      threeVTeams[0].querySelector('div').appendChild(createPlayerCard(3, '玩家3', 0));
      threeVTeams[1].querySelector('div').appendChild(createPlayerCard(4, '玩家4', 0));
      threeVTeams[1].querySelector('div').appendChild(createPlayerCard(5, '玩家5', 0));
      threeVTeams[1].querySelector('div').appendChild(createPlayerCard(6, '玩家6', 0));
    }
    
    // 创建玩家卡片（按钮背景透明度50%）
    function createPlayerCard(id, name, score) {
      const card = document.createElement('div');
      card.className = 'player-card p-2 flex items-center justify-between';
      card.dataset.playerId = id;
      
      card.innerHTML = `
        <h3 class="player-name text-[clamp(0.65rem,1.5vw,0.85rem)] font-medium cursor-pointer text-white">${name}</h3>
        <div class="flex items-center gap-1">
          <div class="player-score text-[clamp(0.75rem,1.8vw,1rem)] font-bold text-white score-transition">${score}</div>
          <div class="flex gap-0.5">
            <!-- 加减按钮（背景透明度50%） -->
            <button class="decrease-btn w-5 h-5 btn-blue flex items-center justify-center btn-bounce rounded-none">
              <i class="fa fa-minus text-[7px]"></i>
            </button>
            <button class="increase-btn w-5 h-5 btn-blue flex items-center justify-center btn-bounce rounded-none">
              <i class="fa fa-plus text-[7px]"></i>
            </button>
          </div>
        </div>
      `;
      
      return card;
    }
    
    // 设置事件监听器
    function setupEventListeners() {
      // 分数增减按钮事件委托
      document.getElementById('scoreboard').addEventListener('click', (e) => {
        if (e.target.closest('.increase-btn')) {
          const card = e.target.closest('.player-card');
          updateScore(card, 1);
        } else if (e.target.closest('.decrease-btn')) {
          const card = e.target.closest('.player-card');
          updateScore(card, -1);
        }
      });
      
      // 双击编辑玩家名称
      document.getElementById('scoreboard').addEventListener('dblclick', (e) => {
        if (e.target.classList.contains('player-name')) {
          const nameElement = e.target;
          nameElement.contentEditable = true;
          nameElement.focus();
          
          // 失去焦点时保存
          nameElement.addEventListener('blur', () => {
            nameElement.contentEditable = false;
          }, { once: true });
          
          // 按Enter保存
          nameElement.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              nameElement.contentEditable = false;
            }
          }, { once: true });
        }
      });
      
      // 模式切换按钮
      document.getElementById('prev-mode').addEventListener('click', () => {
        currentModeIndex = (currentModeIndex - 1 + modes.length) % modes.length;
        switchMode(currentModeIndex);
      });
      
      document.getElementById('next-mode').addEventListener('click', () => {
        currentModeIndex = (currentModeIndex + 1) % modes.length;
        switchMode(currentModeIndex);
      });
      
      // 重置按钮
      document.getElementById('reset-btn').addEventListener('click', resetScores);
    }
    
    // 更新分数
    function updateScore(card, change) {
      const scoreElement = card.querySelector('.player-score');
      let score = parseInt(scoreElement.textContent);
      
      // 在滴血模式下不允许分数为负
      const isBloodMode = document.getElementById('blood-mode').classList.contains('hidden') === false;
      if (isBloodMode && score + change < 0) return;
      
      score += change;
      scoreElement.textContent = score;
      
      // 添加分数变化动画
      scoreElement.classList.add('scale-110');
      setTimeout(() => {
        scoreElement.classList.remove('scale-110');
      }, 200);
      
      // 更新团队总分（如果在团队模式）
      if (currentModeIndex >= 2) { 
        updateTeamTotals();
      }
    }
    
    // 更新团队总分
    function updateTeamTotals() {
      const teams = document.querySelectorAll('.team');
      teams.forEach(team => {
        const playerCards = team.querySelectorAll('.player-card');
        let total = 0;
        
        playerCards.forEach(card => {
          total += parseInt(card.querySelector('.player-score').textContent);
        });
        
        team.querySelector('.team-total span').textContent = total;
      });
    }
    
    // 切换模式
    function switchMode(index) {
      const mode = modes[index];
      
      // 更新标题
      document.getElementById('mode-title').textContent = mode.name;
      
      // 隐藏所有模式内容
      document.querySelectorAll('.mode-content').forEach(content => {
        content.classList.add('hidden');
      });
      
      // 显示当前模式内容
      document.getElementById(`${mode.id}-mode`).classList.remove('hidden');
    }
    
    // 重置分数
    function resetScores() {
      const currentMode = modes[currentModeIndex];
      const initialScore = currentMode.initialScore;
      
      // 重置当前模式下的所有分数
      const currentModeElement = document.getElementById(`${currentMode.id}-mode`);
      const scoreElements = currentModeElement.querySelectorAll('.player-score');
      
      scoreElements.forEach(el => {
        el.textContent = initialScore;
      });
      
      // 更新团队总分（如果在团队模式）
      if (currentModeIndex >= 2) {
        updateTeamTotals();
      }
      
      // 添加重置动画效果
      currentModeElement.classList.add('opacity-50');
      setTimeout(() => {
        currentModeElement.classList.remove('opacity-50');
      }, 300);
    }
  </script>
</body>
</html>
